[project]
name = "mechragnic"
version = "0.1.0"
description = "Mechanic diagnostics RAG: MCP tools, agent, evaluation and ingestion"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "ctmarin" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "mcp[cli]>=2.2.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
airflow = [
    "apache-airflow-task-sdk==1.3.2",
]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
default-groups = ["airflow", "dev"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
